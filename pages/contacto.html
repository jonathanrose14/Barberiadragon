<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="shortcut icon" href="../assets/logobarber.png" type="image/x-icon">

    <title>Barberia Dragon / Contacto </title>
</head>

<body>
    <header>
       <nav class="navbar navbar-expand-lg navbar-dragon">

            <div class="container-fluid">
                <a class="navbar-brand d-flex flex-column" href="../index.html">
                    <h1 class="navbar-brand__titulo">Dragon barber club</h1>
                    <small class="navbar-brand__lema">La barberia del momento</small>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Mostrar u ocultar navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="./menu.html">Menu</a></li>
                        <li class="nav-item"><a class="nav-link" href="./ofertas.html">Ofertas</a></li>
                        <li class="nav-item"><a class="nav-link" href="./nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section class="seccion-contacto">
            <h2>Contactate con nosotros</h2>
            <form action="" class="formulariocontacto">
                <label for="nombreapellido">Nombre y apellido</label>
                <input type="text" name="nombreapellido" id="nombreapellido" placeholder="Jonathan Rose">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="jonathan@barberia.com">
                <label for="telefono">Numero de telefono</label>
                <input type="tel" name="telefono" id="telefono" placeholder="11xxxxxxx">
                <label for="mensaje">¿Cual es tu mensaje?</label>
                <textarea name="mensaje" id="mensaje"
                    placeholder="Hola Buenas tardes , queria hacer una consulta"></textarea>
                <label for="mediodecontacto">Por donde queres que te contactemos?</label>
                <select name="mediodecontacto" id="mediodecontacto">
                    <option value="Telefono">Telefono</option>
                    <option value="mail">Email</option>
                </select>
                <div>
                    <input type="submit" value="Enviar" class="btn btn-dragon">
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>Texto copyright</p>
        <h2>Suscribite al newsletter</h2>
        <form action="">
            <label for="emailNewsletter">Dejanos tu email</label>
            <input type="email" name="email" id="emailNewsletter">
            <input type="submit" value="Enviar" class="newletterenviar">

        </form>
        <nav aria-label="Redes sociales">
            <ul>
                <li><a href="#" target="_blank" rel="noopener noreferrer"><img src="../assets/instagram.png"
                            alt="logo de instagram"> Instagram</a></li>
                <li><a href="#" target="_blank" rel="noopener noreferrer"><img src="../assets/facebook.png"
                            alt="logo de facebook">Facebook</a></li>
                <li><a href="#" target="_blank" rel="noopener noreferrer"><img src="../assets/tiktok.png"
                            alt="logo de tiktok">TikTok</a></li>
                <li><a href="#" target="_blank" rel="noopener noreferrer"><img src="../assets/whatsapp.png"
                            alt="logo de whatsapp">WhatsApp</a></li>
            </ul>
        </nav>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
